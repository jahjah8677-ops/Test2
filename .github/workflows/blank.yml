name: Build Mod Jar

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: unzip -o combomod-source.zip

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Generate Gradle wrapper (if missing)
        working-directory: combomod
        run: |
          if [ ! -f "./gradlew" ]; then
            gradle wrapper --gradle-version 9.6.1
          fi

      - name: Make gradlew executable
        working-directory: combomod
        run: chmod +x ./gradlew

      - name: Build
        working-directory: combomod
        run: ./gradlew build --stacktrace

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: combomod-jar
          path: combomod/build/libs/*.jar
